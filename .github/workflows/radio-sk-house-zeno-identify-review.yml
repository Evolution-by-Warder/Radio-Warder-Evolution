name: Inspect original Slovak House Radio Zeno page vs pinned stream identity (read only)

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - .github/workflows/radio-sk-house-zeno-identify-review.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve station-owned Zeno Slovakia page metadata only
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --compressed \
            --connect-timeout 8 --max-time 65 --retry 2 \
            --user-agent 'WarderRadioSourceAudit/0.1' \
            'https://zeno.fm/radio/house-radioaecku1gta18uv/' -o /tmp/house-zeno.html
          test "$(stat -c %s /tmp/house-zeno.html)" -lt 2000000
      - name: Check exact audio stream and image evidence, no images downloaded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          content=Path('/tmp/house-zeno.html').read_text(encoding='utf-8',errors='replace')
          stream='qm8e21gta18uv'
          print('PAGE BYTES',len(content))
          print('STREAM EXACT ID FOUND',stream in content)
          for token in (stream,'stream.zeno.fm','aecku1gta18uv','House Radio','iEK2OkP5','oBpp2txko'):
              print('TOKEN',token,'COUNT',content.lower().count(token.lower()))
              i=content.find(token)
              if i!=-1:
                  print('CONTEXT',re.sub(r'\s+',' ',html.unescape(content[max(0,i-180):i+250]))[:430])
          for value in re.findall(r'<meta[^>]*(?:og:image|twitter:image)[^>]*>',content,re.I)[:3]:
              print('META',value[:550])
          if stream in content:
              print('EXACT STREAM PAGE EVIDENCE READY FOR FURTHER CHECK')
          else:
              print('NO EXACT STREAM-PAGE LINKAGE; DO NOT ASSIGN HOUSE RADIO ARTWORK')
          PY
