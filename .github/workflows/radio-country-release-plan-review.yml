name: Radio country immutable release delta plan – review only

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - tools/plan_radio_country_release_assets.py
      - tools/prepare_country_release_index.py
      - tests/test_radio_country_release_asset_plan.py
      - tests/test_country_release_index.py
      - .github/workflows/radio-country-release-plan-review.yml
  pull_request:
    paths:
      - tools/plan_radio_country_release_assets.py
      - tools/prepare_country_release_index.py
      - tests/test_radio_country_release_asset_plan.py
      - tests/test_country_release_index.py
      - .github/workflows/radio-country-release-plan-review.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile tools/plan_radio_country_release_assets.py tools/prepare_country_release_index.py tests/test_radio_country_release_asset_plan.py tests/test_country_release_index.py
      - name: Verify exact SHA asset reuse and no unsafe cross-release links
        run: |
          python3 -B tests/test_radio_country_release_asset_plan.py
          python3 -B tests/test_country_release_index.py
