name: Warder Radio automatic fortnightly original-logo review after complete world scan

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - .github/workflows/radio-country-fortnightly-logos-review.yml
  # Becomes active only on an explicitly approved default-branch merge.
  # A successful scheduled/dispatch world scan starts the logo phase.
  workflow_run:
    workflows: ["Radio Browser worldwide bouquet inventory — review-only"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: radio-fortnightly-logos-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -B tests/test_world_country_original_logos.py
          python3 -B tests/test_country_release_changes.py
  index:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.codes.outputs.batches }}
      expected: ${{ steps.codes.outputs.expected }}
      station_count: ${{ steps.codes.outputs.station_count }}
      source_sha: ${{ steps.codes.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tests/test_world_country_original_logos.py
      - name: Retrieve the EXACT completed source world snapshot
        uses: actions/download-artifact@v4
        with:
          name: radio-world-ALL-BOUQUETS-NO-LOGOS-NOT-PRODUCTION
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build/world-source
      - id: codes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          p=pathlib.Path('build/world-source/radio-countries-bouquets.zip')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          check=pathlib.Path('build/world-source/radio-countries-bouquets.zip.sha256')
          assert check.is_file() and digest in check.read_text() and len(digest)==64
          with zipfile.ZipFile(p) as z:
              data=json.loads(z.read('index.json'))
          codes=sorted(data['countries'])
          assert 200 <= len(codes) <= 250 and data['country_count']==len(codes) and data['station_count']>0
          shards=[{'id':f'{i//4:02d}','codes':','.join(codes[i:i+4])} for i in range(0,len(codes),4)]
          pathlib.Path('/tmp/batches.json').write_text(json.dumps(shards,separators=(',',':')))
          pathlib.Path('/tmp/source-sha.txt').write_text(digest)
          pathlib.Path('/tmp/country-count.txt').write_text(str(len(codes)))
          pathlib.Path('/tmp/station-count.txt').write_text(str(data['station_count']))
          print('Pinned source:',len(codes),'countries,',data['station_count'],'stations,',len(shards),'logo shards')
          PY
          echo "batches=$(cat /tmp/batches.json)" >> "$GITHUB_OUTPUT"
          echo "expected=$(cat /tmp/country-count.txt)" >> "$GITHUB_OUTPUT"
          echo "station_count=$(cat /tmp/station-count.txt)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(cat /tmp/source-sha.txt)" >> "$GITHUB_OUTPUT"

  logos:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.index.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'Pillow>=10,<13'
      - uses: actions/download-artifact@v4
        with:
          name: radio-world-ALL-BOUQUETS-NO-LOGOS-NOT-PRODUCTION
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: build/world-source
      - name: Fetch only original images of the pinned UUID catalogues
        shell: bash
        env:
          COUNTRIES: ${{ matrix.batch.codes }}
          SOURCE_SHA: ${{ needs.index.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 -B tools/complete_world_country_original_logos.py \
            --world build/world-source/radio-countries-bouquets.zip \
            --world-sha256 "$SOURCE_SHA" \
            --countries "$COUNTRIES" --workers 4 --out build/finished-logos
          python3 - <<'PY'
          import json,pathlib,zipfile,hashlib
          root=pathlib.Path('build/finished-logos')
          report=json.loads((root/'logo-results.json').read_text())
          assert 1<=report['count']<=4
          for c in report['countries']:
              if c['status']=='complete':
                  code=c['country']
                  folder=root/f'radio-country-{code}-REVIEW-NOT-PRODUCTION'
                  m=json.loads((folder/f'manifests/{code}.json').read_text())
                  assert m['catalogue_complete'] and m['logo_package_complete']
                  assert m['stations']==m['logo_attempted']==c['stations']
                  for rel,v in m['files'].items():
                      p=folder/rel
                      assert hashlib.sha256(p.read_bytes()).hexdigest()==v['sha256']
                  with zipfile.ZipFile(folder/f'logos/{code}.zip') as z:
                      assert len(z.namelist())==c['logos_found']
          print('Review batch:',report['count'],'countries,',sum(x['status']=='complete' for x in report['countries']),'full original-logo attempts')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radio-original-logos-batch-${{ matrix.batch.id }}-REVIEW
          path: build/finished-logos/
          if-no-files-found: error
          retention-days: 14

  summarize:
    if: always() && needs.index.result == 'success' && needs.logos.result == 'success'
    needs: [index, logos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: radio-original-logos-batch-*-REVIEW
          path: build/received
          merge-multiple: false
      - name: Aggregate complete country snapshot shards and refuse any incomplete country
        shell: bash
        env:
          EXPECTED_COUNTRIES: ${{ needs.index.outputs.expected }}
          EXPECTED_STATIONS: ${{ needs.index.outputs.station_count }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,shutil,sys
          parent=pathlib.Path('build/received')
          output=pathlib.Path('build/full-world-shards')
          output.mkdir(parents=True,exist_ok=True)
          seen={};errors=[];stations=0;logos=0
          for shard in sorted(parent.glob('radio-original-logos-batch-*-REVIEW')):
              report=json.loads((shard/'logo-results.json').read_text())
              for item in report['countries']:
                  code=item['country']
                  if code in seen:
                      errors.append('Duplicate '+code)
                      continue
                  seen[code]=item['status']
                  if item['status']!='complete':
                      errors.append(code+':'+item['reason'])
                      continue
                  folder=shard/f'radio-country-{code}-REVIEW-NOT-PRODUCTION'
                  shutil.copytree(folder,output/folder.name)
                  stations+=item['stations']
                  logos+=item['logos_found']
          summary={'processed':len(seen),'complete':sum(s=='complete' for s in seen.values()),
                   'stations':stations,'logos_found':logos,'errors':errors,'published':False}
          pathlib.Path('build/logo-world-results.json').write_text(json.dumps(summary,sort_keys=True,indent=2))
          print('FULL ORIGINAL LOGO REVIEW',json.dumps(summary))
          if len(seen)!=int(os.environ['EXPECTED_COUNTRIES']) or stations!=int(os.environ['EXPECTED_STATIONS']) or errors:
              sys.exit('Incomplete global country logo packages — preserve every successful review shard')
          PY
      - name: Rebuild worldwide bouquet ZIP with FINAL logo-manifest SHA identities
        shell: bash
        env:
          EXPECTED_COUNTRIES: ${{ needs.index.outputs.expected }}
        run: |
          set -euo pipefail
          python3 -B tools/assemble_country_radio_snapshots.py \
            --input build/full-world-shards --out build/world-candidate
          cd build/world-candidate && sha256sum -c radio-countries-bouquets.zip.sha256 && cd ../..
          tag="radio-country-$(date -u +%Y%m%d)"
          python3 -B tools/prepare_country_release_index.py \
            --world build/world-candidate/radio-countries-bouquets.zip \
            --shards build/full-world-shards \
            --out build/world-candidate/latest.json \
            --tag "$tag" --production-candidate
          python3 -c 'import json,os; d=json.load(open("build/world-candidate/latest.json")); assert d["complete"] and d["country_count"]==int(os.environ["EXPECTED_COUNTRIES"]); print("SOURCE CANDIDATE COMPLETE",d["country_count"])'
      - name: Independent final audit of every country and logo ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/audit_radio_country_release_assets.py \
            --world build/world-candidate/radio-countries-bouquets.zip \
            --shards build/full-world-shards \
            --index build/world-candidate/latest.json
      - name: Compare with last official country release and hold coverage regressions
        shell: bash
        run: |
          set -euo pipefail
          args=(--current build/world-candidate/latest.json
                --output build/world-candidate/changes.json)
          url="https://raw.githubusercontent.com/Evolution-by-Warder/Radio-Warder-Evolution/main/assets/radio-country/latest.json"
          if status=$(curl -sSL --connect-timeout 5 --max-time 25 -w '%{http_code}' -o /tmp/radio-prior.json "$url"); then
            if [ "$status" = 200 ]; then
              args+=(--previous /tmp/radio-prior.json)
            elif [ "$status" != 404 ]; then
              echo "Unexpected remote previous snapshot response: $status" >&2
              exit 1
            fi
          else
            echo "Unable to verify previous country release; preserve old state" >&2
            exit 1
          fi
          python3 -B tools/review_country_release_changes.py "${args[@]}"
          python3 - <<'PY'
          import json
          d=json.load(open('build/world-candidate/changes.json'))
          if not d['eligible_for_manual_release_review']:
              raise SystemExit('Country/logo regression or incomplete source: publication held')
          print('Validated country and original-logo changes. No change:',d['no_change'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: radio-world-fortnightly-with-original-logo-checks-REVIEW-ONLY
          path: build/world-candidate/
          if-no-files-found: error
          retention-days: 14
