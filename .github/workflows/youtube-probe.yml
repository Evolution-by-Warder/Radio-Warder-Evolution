name: YouTube stream check
on:
  push:
    branches: [radio-youtube-engine-check-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check current-song search and bounded stream resolution
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json, ssl
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from WarderRadio.youtube import Transport, search_results, allowed_url
          from WarderRadio.youtube_engine.extractor import YouTubeVideoUrl
          transport=Transport()
          report={'query':'Jason Derulo Want To Want Me Westfunk Remix','stage':'search'}
          try:
              page=transport.page('https://www.youtube.com/results?'+urlencode({'search_query':report['query'],'hl':'en'}))
              results=search_results(page)
              report['matches']=results
              if not results: raise LookupError('No public search results; possible consent/network restriction')
              report['stage']='resolve'
              resolver=YouTubeVideoUrl(); resolver._download_webpage=transport.page
              clients=[]
              for client in (3,101,5,85):
                  try:
                      webpage=transport.page('https://www.youtube.com/watch?v='+results[0]['id']) if client==5 else None
                      response,player=resolver._extract_player_response(results[0]['id'],None,client,'en',webpage)
                      response=response or {}
                      state=response.get('playabilityStatus',{})
                      streaming=response.get('streamingData',{})
                      clients.append(dict(client=client,status=state.get('status'),reason=state.get('reason'),
                          formats=len(streaming.get('formats',[])),adaptive=len(streaming.get('adaptiveFormats',[])),
                          hls=bool(streaming.get('hlsManifestUrl'))))
                  except Exception as exc:
                      clients.append(dict(client=client,error=type(exc).__name__+': '+str(exc)[:200]))
              report['clients']=clients
              url=allowed_url(resolver.extract(results[0]['id']),media=True)
              report['stage']='media'
              with urlopen(Request(url,headers={'Range':'bytes=0-1023'}),timeout=8,context=ssl.create_default_context()) as response:
                  allowed_url(response.url,media=True)
                  data=response.read(1024)
                  report.update(status=response.status,bytes=len(data),content_type=response.headers.get('Content-Type'))
                  assert data,'Empty media response'
              report['stage']='complete'
          except Exception as exc:
              report['error']=type(exc).__name__+': '+str(exc)[:300]
          print('VIDEO_PROBE '+json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify receiver candidate without publication
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: |
          python3 tools/build_ipk.py
          python3 tools/build_ipk.py --legacy-bridge
          python3 -m unittest discover -s tests -q
          python3 tools/fetch_native.py
          python3 tools/test_native.py --upstream fixtures/openpli-release-9.2 -q
          python3 tools/test_native.py --upstream fixtures/openatv-81-reviewed-base -q
          python3 tools/test_native.py --upstream fixtures/openatv-8.0-next -q
          python3 tools/verify_ipk.py
      - uses: actions/upload-artifact@v4
        with:
          name: radio-youtube-receiver-candidate
          path: |
            dist/enigma2-plugin-extensions-radio-warder-evolution_*.ipk
            dist/build.json
            dist/SHA256SUMS
          retention-days: 14
