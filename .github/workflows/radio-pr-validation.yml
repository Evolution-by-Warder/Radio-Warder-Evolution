name: Radio PR validation (no publishing)
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - work/radio-country-left-navigation-eight-rows
      - release/radio-0.1.9-20261106
      - release/radio-0.1.9.1-20261106
      - release/radio-0.1.9.2-20261106
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test image decoder
        run: python3 -m pip install Pillow
      - name: Compile all Python files
        run: python3 -m compileall -q src tests tools
      - name: Build independent IPK and legacy bridge before unit tests
        run: |
          python3 tools/build_ipk.py --package-revision 2
          python3 tools/build_ipk.py --legacy-bridge
          python3 tools/build_ipk.py --tester-bridge
      - name: Run complete unit suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated IPK
        run: python3 tools/verify_ipk.py
      - name: Fetch native Enigma2 fixtures
        run: python3 tools/fetch_native.py
      - name: Replay OpenPLi and OpenATV Python widgets
        run: |
          python3 tools/test_native.py --upstream fixtures/openpli-release-9.2 -v
          python3 tools/test_native.py --upstream fixtures/openatv-81-reviewed-base -v
          python3 tools/test_native.py --upstream fixtures/openatv-8.0-next -v
      - name: Replay stable 0.1.9.4 upgrade with real opkg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config libarchive-dev libssl-dev
          curl --fail --location --retry 3 'https://github.com/Evolution-by-Warder/Radio-Warder-Evolution/releases/download/warder-radio-v0.1.9.4/enigma2-plugin-extensions-radio-warder-evolution_0.1.9.4_all.ipk' -o /tmp/radio-stable-0194.ipk
          sh tools/build_host_opkg.sh /tmp/radio-test-opkg cc330e2a5e311fa99ead37f6e439599a2a0909a0
          python3 tools/verify_online_upgrade.py --opkg /tmp/radio-test-opkg/src/opkg --stable /tmp/radio-stable-0194.ipk --candidate dist/*_all.ipk
      - name: Upload test-only IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-browser-receiver-test
          path: |
            dist/*_all.ipk
            dist/build.json
            dist/SHA256SUMS
