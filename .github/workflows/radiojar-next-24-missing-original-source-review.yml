name: New Radiojar owner images for missing MX GR US DE logos - skip old 24 (review only)

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - .github/workflows/radiojar-next-24-missing-original-source-review.yml
      - tools/stage_radiojar_new_missing_owner_ids.py
      - tests/test_stage_radiojar_new_missing_owner_ids.py

permissions:
  contents: read
  actions: read

jobs:
  verify-new-firstparty-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Evolution-by-Warder/Radio-Warder-Evolution
      ROOT: /tmp/warder-radiojar-new-24-priority
      WORLD_SHA: 62fefd31160af380942e471bb04fe59d76ca2a780c2c4a7e1eefe246d4c91fa5
    steps:
      - uses: actions/checkout@v4
      - name: Install image validator only on isolated review runner
        run: python3 -m pip install --quiet 'Pillow>=10,<13'
      - name: Offline original-image, prior-ID exclusion and station collision tests
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python3 -B tests/test_stage_radiojar_new_missing_owner_ids.py
          PYTHONPATH=src:tools python3 -B tests/test_probe_radiojar_firstparty_source_224.py
          PYTHONPATH=src:tools python3 -B tests/test_missing_radio_logo_recovery.py
      - name: Download current SHA-verified 39700 world and previous 24-owner evidence, not images
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/world-source" "$ROOT/prior" "$ROOT/old" "$ROOT/mx"
          test "$(gh run view 44886213146 --json conclusion -q .conclusion)" = success
          test "$(gh run view 44885850408 --json conclusion -q .conclusion)" = success
          gh run download 44886213146 \
            -n radio-two-visual-approved-Radiojar-originals-39700-REVIEW-ONLY \
            -D "$ROOT/world-source"
          gh run download 44885850408 \
            -n radio-new-Radiojar-owner-images-224-world-REVIEW-UNAPPROVED \
            -D "$ROOT/prior"
          python3 - <<'PY'
          import hashlib,os,shutil
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          files=list((root/"world-source").rglob("radio-countries-bouquets.zip"))
          assert len(files)==1
          shutil.copyfile(files[0],root/"world.zip")
          assert hashlib.sha256((root/"world.zip").read_bytes()).hexdigest()==os.environ["WORLD_SHA"]
          assert (root/"prior/radiojar-firstparty-source-224-review.json").is_file()
          print("CURRENT 39700 WORLD AND PREVIOUS 24 OWNER IDS SHA-PINNED")
          PY
          rm -rf "$ROOT/world-source"
      - name: Restore current DE GR US country ZIPs and historic MX shard, all SHA-verified
        run: |
          set -euo pipefail
          test "$(gh run view 44872651080 --json conclusion -q .conclusion)" = success
          test "$(gh run view 44867416434 --json conclusion -q .conclusion)" = success
          test "$(gh run view 44801652426 --json conclusion -q .conclusion)" = success
          mkdir -p "$ROOT/de" "$ROOT/gr" "$ROOT/us"
          gh run download 44886213146 \
            -n radio-two-visual-approved-Radiojar-originals-39700-REVIEW-ONLY \
            -D "$ROOT/de"
          gh run download 44872651080 \
            -n radio-co-crosscountry-12-additional-originals-REVIEW-ONLY \
            -D "$ROOT/gr"
          gh run download 44867416434 \
            -n radio-US-RadioCo-original-logos-REVIEW-ONLY -D "$ROOT/us"
          shard=$(python3 - <<'PY'
          from zipfile import ZipFile
          import json,os
          with ZipFile(os.environ["ROOT"]+"/world.zip") as z:
              index=json.loads(z.read("index.json"))
          print(f"{sorted(index['countries']).index('MX')//8:02d}")
          PY
          )
          gh run download 44801652426 \
            -n "radio-canonical-39643-country-shard-$shard-REVIEW" -D "$ROOT/mx"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json,os,shutil
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"world.zip") as z: idx=json.loads(z.read("index.json"))
          assert idx["country_count"]==224 and idx["station_count"]==48219
          assert sum(v["logos_found"] for v in idx["countries"].values())==39700
          for cc,folder in (("MX","mx"),("GR","gr"),("US","us"),("DE","de")):
              candidates=list((root/folder).rglob("radio-country-"+cc+"-REVIEW-NOT-PRODUCTION"))
              assert len(candidates)==1,(cc,len(candidates))
              source=candidates[0]
              path=source/"logos"/(cc+".zip")
              assert path.is_file()
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest==idx["countries"][cc]["logo_sha256"],cc
              shutil.copytree(source,root/"old"/source.name)
              print("ORIGINAL COUNTRY SHA PASS",cc,idx["countries"][cc]["logos_found"],digest)
          PY
          rm -rf "$ROOT/mx" "$ROOT/de" "$ROOT/gr" "$ROOT/us"
      - name: Query ONLY NEW station-specific Radiojar image IDs missing in actual country ZIPs
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python3 -B tools/stage_radiojar_new_missing_owner_ids.py \
            --world "$ROOT/world.zip" --old-root "$ROOT/old" \
            --prior "$ROOT/prior/radiojar-firstparty-source-224-review.json" \
            --out "$ROOT/review"
      - name: Audit actual missing images and confirm no old PNG/release/world mutations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ["ROOT"])
          report=json.loads((root/"review/radiojar-new-ids-priority-country-review.json").read_text())
          assert report["review_only"] and report["metadata_and_images_only"]
          assert report["approved_new_png"]==0 and report["world_created"] is False
          assert report["world_sha256"]==os.environ["WORLD_SHA"]
          assert report["country_count"]==224 and report["station_count"]==48219
          assert report["baseline_logos"]==39700 and report["prior_distinct_owner_ids_excluded"]==24
          assert 0<report["new_distinct_owner_ids_requested"]<=24
          assert report["new_distinct_owner_ids_requested"]==len(report["attempts"])
          assert report["downloaded_images_for_visual_review"]<=len(report["attempts"])
          assert all(row["approved"] is False for row in report["attempts"])
          assert not list((root/"review").rglob("radio-countries-bouquets.zip"))
          assert not list((root/"review").rglob("radio-country-*-REVIEW-NOT-PRODUCTION"))
          print("NEW RADIOJAR MISSING LOGO CANDIDATES, REVIEW ONLY",json.dumps({
              k:v for k,v in report.items() if k in (
                  "inventory","new_distinct_owner_ids_requested",
                  "downloaded_images_for_visual_review",
                  "shared_images_in_sample","errors","eligible_ids_by_country")
              },sort_keys=True))
          PY
      - name: Preserve only image provenance, original image candidates and review contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: radiojar-next-24-missing-owner-images-UNAPPROVED-REVIEW
          path: /tmp/warder-radiojar-new-24-priority/review/
          retention-days: 30
          if-no-files-found: error
