name: Inspect independent 125-country DAB+LIVE open station-logo feed (read-only)

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - .github/workflows/radio-dabplus-feed-probe.yml

permissions:
  contents: read

jobs:
  inspect-open-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch publicly documented JSON feed; do not publish or merge
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --compressed \
            --connect-timeout 10 --max-time 110 --retry 2 \
            --user-agent 'WarderRadioLogoAudit/0.1 (+https://github.com/Evolution-by-Warder/Radio-Warder-Evolution)' \
            'https://dabplus.live/feeds/stations.json' \
            -o /tmp/dabplus-stations.json
          test "$(stat -c %s /tmp/dabplus-stations.json)" -lt 80000000
      - name: Inspect country and image metadata schema without any downloads
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data=json.loads(Path('/tmp/dabplus-stations.json').read_text(encoding='utf-8'))
          print('SCHEMA TYPE',type(data).__name__)
          if isinstance(data,dict):
              print('TOP KEYS',list(data)[:30])
              sets=[(key,value) for key,value in data.items() if isinstance(value,list) and value]
              print('TOP LEVEL LISTS',[(str(k),len(v)) for k,v in sets[:12]])
              if sets:
                  key,records=sets[0]
                  print('FIRST GROUP',key,'SIZE',len(records),'TYPE',type(records[0]).__name__)
                  print('FIRST GROUP ROW',str(records[0])[:1300])
              if not sets:
                  print('ROOT VALUES',[(k,str(v)[:250]) for k,v in list(data.items())[:15]])
          elif isinstance(data,list):
              print('LIST ROWS',len(data))
              for row in data[:3]:
                  print('FIRST ROW',str(row)[:1300])
          print('FEED BYTES',Path('/tmp/dabplus-stations.json').stat().st_size)
          PY
