name: Warder Radio TEST
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'
      - 'COPYING'
      - '.github/workflows/radio-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build test payload
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/build_ipk.py
          python3 tools/build_ipk.py --legacy-bridge
          echo "RADIO_VERSION=$(cat src/WarderRadio/version.txt)" >> "$GITHUB_ENV"
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and verify pinned native fixtures
        run: python3 tools/fetch_native.py
      - name: Native OpenPLi and OpenATV replays
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/test_native.py --upstream fixtures/openpli-release-9.2 -v
          python3 tools/test_native.py --upstream fixtures/openatv-81-reviewed-base -v
          python3 tools/test_native.py --upstream fixtures/openatv-8.0-next -v
      - name: Build and verify independent IPK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/verify_ipk.py
      - name: Verify published full country catalogue and cache round trip
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, tempfile, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from WarderRadio.model import Catalogue, MAX_DOWNLOAD, UPSTREAM
          with urlopen(Request(UPSTREAM, headers={'User-Agent': 'WarderRadio-catalogue-verification/1'}), timeout=30) as response:
              body = response.read(MAX_DOWNLOAD + 1)
          assert len(body) <= MAX_DOWNLOAD
          report_url = UPSTREAM.rsplit('/', 1)[0] + '/build.json'
          with urlopen(Request(report_url, headers={'User-Agent': 'WarderRadio-catalogue-verification/1'}), timeout=20) as response:
              report = json.loads(response.read(128 * 1024))
          assert len(body) == report['receiver']['bytes']
          assert hashlib.sha256(body).hexdigest() == report['receiver']['sha256']
          start = time.monotonic()
          items = Catalogue.fetch(lambda *args, **kwargs: io.BytesIO(body))
          decode_seconds = time.monotonic() - start
          assert len(items) == report['processing']['total_stations']
          assert len({item['id'] for item in items}) == len(items)
          assert list(dict.fromkeys(item['group'] for item in items))[:2] == ['Slovensko', 'Čechy']
          seed = json.loads(Path('src/WarderRadio/seed.json').read_text())
          owned = [item for item in seed if item['group'] in ('Slovensko', 'Čechy')]
          by_reference = {item['reference']: item for item in items}
          assert len(owned) == 321
          for item in owned:
              found = by_reference[item['reference']]
              assert (found['name'], found['url']) == (item['name'], item['url'])
          with tempfile.TemporaryDirectory() as directory:
              catalogue = Catalogue(directory, load=False)
              catalogue.replace(items)
              Catalogue._snapshots.clear()
              reopened = Catalogue(directory)
              assert len(reopened.items) == len(items)
              assert reopened.items[-1]['id'] == items[-1]['id']
              proof = dict(stations=len(items), groups=len(reopened.groups()), owned_preserved=len(owned),
                           compressed_bytes=len(body), sha256=hashlib.sha256(body).hexdigest(),
                           decode_seconds=decode_seconds, cache_bytes=Path(catalogue.cache).stat().st_size,
                           note='Hosted-runner import/cache verification; no receiver playback claim.')
          Path('dist/catalogue-live-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          PY
      - name: Verify current-song artwork against live provider
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import hashlib, json, tempfile
          from pathlib import Path
          from WarderRadio.covers import lookup_cover
          from WarderRadio.metadata import repair_legacy_pair
          cases = [
              ('chill77', 'CHILL77', 'PAPAOUTAI', 'iTunes', 2),
              ('bcc-worship', 'BCC Worship', 'Si pri mne blízko', 'iTunes', 2),
              ('jackers-revenge', 'Jackers Revenge', 'Comin Out (Once Again) (Original Mix)', 'iTunes', 2),
              ('dianah-kay', 'Dianah Kay', 'ILLUMIN8', 'iTunes artist', 3),
              ('rust2dust', 'RUST 2 DUST', 'My vs Oni', 'iTunes', 2),
              ('jason-derulo', 'JASON_DERULO', 'WANT_TO_WANT_ME_WESTFUNK_REMIX', 'iTunes', 2),
              ('folk', *repair_legacy_pair('Kandráèovci', '13. Hej, už je òeda¾eko', 'cp1250'), 'iTunes artist', 3),
          ]
          reports = []
          for slug, artist, title, expected, request_count in cases:
              events = []
              with tempfile.TemporaryDirectory() as cache:
                  path, provider = lookup_cover(artist, title, directory=cache, trace=events.append)
                  assert path and provider == expected, (slug, events)
                  data = Path(path).read_bytes()
                  assert data.startswith(b'\xff\xd8') and len(data) > 1024
                  selected = [event for event in events if event['event'] == 'selected']
                  assert selected and selected[-1]['rank'] > 0, (slug, events)
                  requests = [event for event in events if event['event'] == 'request']
                  assert len(requests) == request_count, (slug, events)
                  report = dict(case=slug, provider=provider, selected=selected[-1], events=events,
                                bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                  Path('dist/artwork-live-'+slug+'.jpg').write_bytes(data)
                  print(json.dumps(report, ensure_ascii=False))
                  reports.append(report)
          Path('dist/artwork-live-proof.json').write_text(json.dumps(reports, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: warder-radio-${{ env.RADIO_VERSION }}
          path: dist/*
      - name: Publish receiver-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="warder-radio-v$RADIO_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "Warder Radio $RADIO_VERSION" --notes-file docs/CHANGELOG.md
          fi
          gh release upload "$tag" dist/*.ipk dist/SHA256SUMS dist/build.json --clobber
          bridge_tag="warder-radio-v0.1.0-test11"
          if ! gh release view "$bridge_tag" >/dev/null 2>&1; then
            gh release create "$bridge_tag" --target "$GITHUB_SHA" --prerelease \
              --title "Warder Radio package migration bridge" \
              --notes "Compatibility bridge for the old warderradio package. Restarts into the v2 updater, which offers Radio Warder Evolution. Direct installations should use the latest renamed package."
          fi
          # The bridge is immutable once published; later builds keep its bytes.
          if gh release view "$bridge_tag" --json assets --jq '.assets[].name' | grep -q '\.ipk$'; then
            echo 'Existing immutable compatibility bridge retained.'
            gh release download "$bridge_tag" --pattern build.json --dir dist/legacy --clobber
          else
            gh release upload "$bridge_tag" dist/legacy/*.ipk dist/legacy/SHA256SUMS dist/legacy/build.json
          fi
      - name: Verify public download and advance testing feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git switch -C warder-radio-feed origin/main
          test "$(cat src/WarderRadio/version.txt)" = "$RADIO_VERSION"
          python3 tools/publish_feed.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- update/testing.json update/v2/testing.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Warder Radio $RADIO_VERSION testing feed [skip ci]"
            git push origin HEAD:main
          fi
