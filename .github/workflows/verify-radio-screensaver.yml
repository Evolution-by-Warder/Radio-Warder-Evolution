name: Verify Radio OLED screensaver (no publishing)
on:
  push:
    branches:
      - feature/now-playing-screensaver-20261111
  pull_request:
    paths:
      - 'src/WarderRadio/screen.py'
      - 'src/WarderRadio/screensaver.py'
      - 'src/WarderRadio/skin.py'
      - 'src/WarderRadio/model.py'
      - 'src/WarderRadio/settings_screen.py'
      - 'src/WarderRadio/i18n.py'
      - 'tests/test_screensaver.py'
      - '.github/workflows/verify-radio-screensaver.yml'
permissions:
  contents: read
jobs:
  saver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests/test_screensaver.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source and test all saver geometry, state and playback hooks
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q src/WarderRadio tests/test_screensaver.py
          python -m unittest discover -s tests -p test_screensaver.py -v
