name: Pinned world bouquet → original Warder Radio logo ZIP tests
on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - tools/complete_world_country_original_logos.py
      - tests/test_world_country_original_logos.py
      - .github/workflows/radio-pinned-world-logos-tests.yml
  pull_request:
    paths:
      - tools/complete_world_country_original_logos.py
      - tests/test_world_country_original_logos.py
      - .github/workflows/radio-pinned-world-logos-tests.yml
permissions: { contents: read }
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile tools/complete_world_country_original_logos.py tests/test_world_country_original_logos.py
      - name: Check complete country identity and exact logo files offline
        run: python3 -B tests/test_world_country_original_logos.py
