name: Radio Browser 14-day release delta safety tests

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - tools/review_country_release_changes.py
      - tools/prepare_country_release_index.py
      - tests/test_country_release_changes.py
      - tests/test_country_release_index.py
      - .github/workflows/country-release-delta-review.yml
  pull_request:
    paths:
      - tools/review_country_release_changes.py
      - tools/prepare_country_release_index.py
      - tests/test_country_release_changes.py
      - tests/test_country_release_index.py
      - .github/workflows/country-release-delta-review.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile tools/review_country_release_changes.py tools/prepare_country_release_index.py tests/test_country_release_changes.py tests/test_country_release_index.py
      - name: Prevent incomplete or regressed country/logo snapshots
        run: |
          python3 -B tests/test_country_release_changes.py
          python3 -B tests/test_country_release_index.py
