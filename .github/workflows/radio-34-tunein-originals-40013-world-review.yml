name: 34 visual-confirmed TuneIn exact-stream ORIGINAL radio logos - new 40013 world REVIEW

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - .github/workflows/radio-34-tunein-originals-40013-world-review.yml
      - tools/merge_tunein_34_stream_logo_originals.py
      - tests/test_merge_tunein_34_stream_logo_originals.py

permissions:
  contents: read
  actions: read

jobs:
  one-new-world-fourteen-countries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/warder-tunein-34-visual-originals
      WORLD_SHA: 2edfced0a9866c07bff0c83017f73bb09927c94cc99fd82ac859b8734f31149b
      STAGE_SHA: a93bde7174d9ac6edaf7d170355e87f4ddba1eb969d19412008906a7f71d1be2
      CODES: BG,BR,CA,CO,DE,ES,FR,GB,IN,IT,MX,NP,PL,RO
    steps:
      - uses: actions/checkout@v4
      - name: Strict 41-image visual decisions, 34 owner brand approvals, original-artwork SHA regressions
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'Pillow>=10,<13' 'defusedxml>=0.7,<1'
          PYTHONPATH=src:tools python3 -B tests/test_merge_tunein_34_stream_logo_originals.py
          PYTHONPATH=src:tools python3 -B tests/test_stage_tunein_exact_stream_world_missing.py
          PYTHONPATH=src:tools python3 -B tests/test_missing_radio_logo_recovery.py
          PYTHONPATH=src:tools python3 -B tests/test_assemble_recovered_radio_world.py
          python3 -m py_compile tools/merge_tunein_34_stream_logo_originals.py
      - name: Fetch pinned 39979-world original logo baseline and all-400 official TuneIn source proofs
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"/{source,stage,prior39964,prior39867,patch13,patch7,baseline,old}
          for id in 44913642417 44914331569 44911563049 44900502836 44906253671 44907497364 44801652426; do
            test "$(gh run view "$id" --json conclusion -q .conclusion)" = success
          done
          gh run download 44913642417 -n radio-tef-15-visual-approved-39979-world-REVIEW-ONLY -D "$ROOT/source"
          gh run download 44914331569 -n radio-tunein-400-missing-exact-owner-station-PNG-UNAPPROVED-REVIEW -D "$ROOT/stage"
          cp "$(find "$ROOT/source" -type f -name radio-countries-bouquets.zip | head -1)" "$ROOT/world.zip"
          echo "$WORLD_SHA  $ROOT/world.zip" | sha256sum --check
          echo "$STAGE_SHA  $ROOT/stage/tunein-all-country-missing-station-originals-REVIEW.json" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os,json
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"world.zip") as z:idx=json.loads(z.read("index.json"))
          assert (idx["country_count"],idx["station_count"])==(224,48219)
          assert sum(x["logos_found"] for x in idx["countries"].values())==39979
          codes=os.environ["CODES"].split(",")
          assert len(codes)==len(set(codes))==14
          positions=sorted({sorted(idx["countries"]).index(cc)//8 for cc in codes})
          (root/"shard-ids.txt").write_text("".join(f"{n:02d}\n" for n in positions))
          print("14 PRECISE SOURCE ORIGINAL ZIP COUNTRIES",codes,"SHARDS",positions)
          PY
      - name: Resolve only 14 current original country ZIP hashes against immutable approved source artifacts
        run: |
          set -euo pipefail
          while IFS= read -r shard; do
            gh run download 44801652426 -n "radio-canonical-39643-country-shard-$shard-REVIEW" -D "$ROOT/baseline/$shard"
          done < "$ROOT/shard-ids.txt"
          gh run download 44911563049 -n radio-global-85-highres-originals-39964-world-REVIEW-ONLY -D "$ROOT/prior39964"
          gh run download 44900502836 -n radio-two-firstparty-broadcaster-39867-world-REVIEW-ONLY -D "$ROOT/prior39867"
          gh run download 44906253671 -n radio-reconciled-20-stale-country-original-sha-REVIEW-ONLY -D "$ROOT/patch13"
          gh run download 44907497364 -n radio-final-seven-current-country-SHA-originals-REVIEW-ONLY -D "$ROOT/patch7"
          python3 - <<'PY'
          import os,json,hashlib,shutil
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ["ROOT"])
          with ZipFile(root/"world.zip") as z:idx=json.loads(z.read("index.json"))
          codes=os.environ["CODES"].split(",")
          priority=("source","prior39964","prior39867","patch7","patch13","baseline")
          for cc in codes:
              valid=[]
              for subdir in priority:
                  for folder in (root/subdir).rglob("radio-country-"+cc+"-REVIEW-NOT-PRODUCTION"):
                      archive=folder/"logos"/(cc+".zip")
                      if archive.is_file() and hashlib.sha256(archive.read_bytes()).hexdigest()==idx["countries"][cc]["logo_sha256"]:
                          valid.append(folder)
                  if valid:break
              if len(valid)!=1:raise ValueError("Missing pinned country logo original "+cc+": "+str(len(valid)))
              shutil.copytree(valid[0],root/"old"/valid[0].name)
              print("OLD ORIGINAL STATION LOGO COUNTRY VERIFIED",cc,idx["countries"][cc]["logos_found"])
          PY
          rm -rf "$ROOT/source" "$ROOT/prior39964" "$ROOT/prior39867" "$ROOT/patch7" "$ROOT/patch13" "$ROOT/baseline"
      - name: Combine only 34 manually checked station brand pictures with exact unchanged UUID/audio/homepage
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python3 -B tools/merge_tunein_34_stream_logo_originals.py \
            --world "$ROOT/world.zip" --old-root "$ROOT/old" \
            --stage "$ROOT/stage" --out "$ROOT/candidates"
      - name: ONE complete 224-country REVIEW world of 40013 originals; protect all previous 39979 PNGs bytewise
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools python3 -B tools/assemble_recovered_radio_world.py \
            --world "$ROOT/world.zip" --world-sha256 "$WORLD_SHA" \
            --old-root "$ROOT/old" --candidates "$ROOT/candidates" \
            --countries "$CODES" --out "$ROOT/new-world"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os,json,hashlib
          root=Path(os.environ["ROOT"])
          proof=json.loads((root/"candidates/tunein-34-source-stream-exact-logo-merge-REVIEW.json").read_text())
          final=json.loads((root/"new-world/world-recovery-review.json").read_text())
          assert proof["review_only"] and final["review_only"]
          assert proof["source_stage_sha256"]==os.environ["STAGE_SHA"]
          assert proof["source_images_audited"]==41 and len(proof["quarantined"])==7
          assert proof["approved_new_original_png"]==final["logos_added"]==34
          assert proof["old_png_byte_identical"]==39979
          assert final["original_world_sha256"]==os.environ["WORLD_SHA"]
          assert final["country_count"]==224 and final["station_count"]==48219
          changed={x["country"]:x["added"] for x in final["countries_changed"]}
          assert changed=={"BG":1,"BR":1,"CA":2,"CO":1,"DE":5,"ES":5,
                           "FR":6,"GB":1,"IN":1,"IT":2,"MX":4,"NP":2,"PL":1,"RO":2}
          zipfile=root/"new-world/radio-countries-bouquets.zip"
          sha=hashlib.sha256(zipfile.read_bytes()).hexdigest()
          assert sha==final["new_world_sha256"]
          with ZipFile(zipfile) as z:
              idx=json.loads(z.read("index.json"))
              assert (idx["country_count"],idx["station_count"])==(224,48219)
              assert sum(x["logos_found"] for x in idx["countries"].values())==40013
              assert 48219-40013==8206
          print("ALL-COUNTRY 34 VISUAL TUNEIN BRAND RADIO ORIGINALS PASS",json.dumps({
              "before":39979,"new":34,"after":40013,"missing":8206,
              "changed_countries":changed,"world_sha256":sha,
              "all_prior_png_byte_identical":True},sort_keys=True))
          PY
      - name: Upload only new signed 40013 world and 14 updated country original logo ZIPs for review
        uses: actions/upload-artifact@v4
        with:
          name: radio-tunein-34-visual-originals-40013-world-REVIEW-ONLY
          path: |
            /tmp/warder-tunein-34-visual-originals/candidates/
            /tmp/warder-tunein-34-visual-originals/new-world/
          retention-days: 30
          if-no-files-found: error
