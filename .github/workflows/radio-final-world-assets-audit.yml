name: Final audit of 224 Radio Browser country original logo packages - review only

on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths:
      - .github/workflows/radio-final-world-assets-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: radio-final-224-assets-audit
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Read verified full-world manifest from successful source run
        uses: actions/download-artifact@v4
        with:
          name: radio-world-224-with-original-logo-checks-REVIEW-ONLY
          run-id: 44583128017
          github-token: ${{ github.token }}
          path: build/final-world
      - name: Read all country logo ZIP shard review artifacts, no new network-logo requests
        uses: actions/download-artifact@v4
        with:
          pattern: radio-original-logos-batch-*-REVIEW
          run-id: 44583128017
          github-token: ${{ github.token }}
          path: build/country-artifacts
          merge-multiple: false
      - name: Reassemble only existing exact country assets into a local audit tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          root=Path('build/country-artifacts')
          target=Path('build/audit-country-shards')
          target.mkdir(parents=True,exist_ok=True)
          shards=sorted(root.glob('radio-original-logos-batch-*-REVIEW'))
          if len(shards)!=28:
              raise SystemExit('Expected 28 country shard artifacts, received %s'%len(shards))
          countries=set()
          stations=0
          for shard in shards:
              record=json.loads((shard/'logo-results.json').read_text())
              if record.get('complete') is not True:
                  raise SystemExit('Incomplete country logo shard '+shard.name)
              for row in record['countries']:
                  code=row['country']
                  if code in countries or row.get('status')!='complete':
                      raise SystemExit('Duplicate or incomplete country '+code)
                  countries.add(code)
                  stations+=row['stations']
                  src=shard/('radio-country-'+code+'-REVIEW-NOT-PRODUCTION')
                  if not src.is_dir():
                      raise SystemExit('Missing per-country assets '+code)
                  shutil.copytree(src,target/src.name)
          if len(countries)!=224 or stations!=48219:
              raise SystemExit('Wrong country/station total')
          print('Original snapshot assets collected:',len(countries),
                'countries,',stations,'stations, 28 reviewed country archives')
          PY
      - name: Independently audit world ZIP, all 224 original logo ZIP hashes and UUID names
        run: |
          python3 -B tests/test_radio_country_release_assets.py
          python3 -B tools/audit_radio_country_release_assets.py \
            --world build/final-world/radio-countries-bouquets.zip \
            --index build/final-world/latest.json \
            --shards build/audit-country-shards \
            | tee build/final-world/audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('build/final-world/audit.json'))
          assert d['country_count']==224 and d['station_count']==48219
          assert d['logo_count']==39110 and d['logo_missing']==9109,d
          print('FINAL 224-COUNTRY ORIGINAL PNG SHA AUDIT PASS:',d['logo_count'],
                'original logos,',d['logo_missing'],'unavailable')
          PY
      - name: Upload the small verified manifest and audit only - NOT the 39k source images
        uses: actions/upload-artifact@v4
        with:
          name: radio-all-224-audit-39110-logos-REVIEW-NOT-PRODUCTION
          path: |
            build/final-world/latest.json
            build/final-world/audit.json
            build/final-world/radio-countries-bouquets.zip.sha256
          if-no-files-found: error
          retention-days: 30
